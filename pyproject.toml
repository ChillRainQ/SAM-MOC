[project]
name = "sam-moc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "easydict>=1.14",
    "matplotlib>=3.11.2",
    "mmcv-lite>=2.0,<2.2",
    "mmengine>=0.10.7",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pillow>=13.0.0",
    "sam-2",
    "scipy>=1.18.1",
    "tensorboardx>=2.6.5",
    "timm>=0.9,<2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "722d1d15111c689908aeeb82d49a57780aac5153" }

# Runtime requirements from setup.py at the pinned SAM 2 revision.
[[tool.uv.dependency-metadata]]
name = "sam-2"
version = "1.0"
requires-dist = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=1.24.4",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
]
