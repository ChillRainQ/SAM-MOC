[project]
name = "sam-moc"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "easydict>=1.14",
    "matplotlib>=3.7",
    "mmcv-lite>=2.0,<2.2",
    "mmengine>=0.10.7",
    "numpy==1.23.5",
    "opencv-python>=4.8,<4.12",
    "pillow>=9.4",
    "scipy>=1.10",
    "tensorboardx>=2.6",
    "timm>=0.9,<2",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.66",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
