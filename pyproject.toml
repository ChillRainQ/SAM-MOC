[project]
name = "sam-moc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "easydict>=1.14",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "torch>=2.15.0",
]

[project.optional-dependencies]
rwkv = [
    "mmcv-lite>=2.0,<2.2",
    "mmdet>=3.3,<3.4",
    "mmengine>=0.10.7",
    "mmpretrain>=1.2,<1.3",
    "ninja>=1.13.2",
    "opencv-python>=5.1.0.95",
    "tensorboardx>=2.6.5",
    "timm>=0.9,<2",
    "torchvision>=0.29.2",
]
